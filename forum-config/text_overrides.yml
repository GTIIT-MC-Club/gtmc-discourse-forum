- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.bookmark.instructions
  value: '第一步：把这条私信收藏起来，以后想找我随时翻得到。点下面的 <img src="%{base_uri}/plugins/discourse-narrative-bot/images/font-awesome-ellipsis.png" width="16" height="16"> 展开更多操作，再点 <img src="%{base_uri}/plugins/discourse-narrative-bot/images/font-awesome-bookmark.png" width="16" height="16"> **把这条私信加入书签**。做完之后说不定有份 :gift: 等着你。'
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.bookmark.not_found
  value: '我没看到书签 :thinking: 书签按钮在每条帖子下面，要先点 <img src="%{base_uri}/plugins/discourse-narrative-bot/images/font-awesome-ellipsis.png" width="16" height="16"> 展开更多操作才会出现。'
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.bookmark.reply
  value: 收藏成功！以后想回到我们的对话，点右上角的头像，进[书签标签页](%{bookmark_url})就能找到。别人发的好帖子也可以这样存起来。
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.emoji.instructions
  value: |-
    第三步：表情。你可能注意到我的消息里有小图标 :blue_car::dash: 它们叫[表情符号](https://en.wikipedia.org/wiki/Emoji)。在回复里**加一个表情**吧，下面任意一种都行：

    - 输入 `:) ;) :D :P :O`

    - 输入冒号 <kbd>:</kbd>，再接表情的名字，比如 `:tada:`

    - 点编辑器里的表情按钮 <img src="%{base_uri}/plugins/discourse-narrative-bot/images/font-awesome-smile.png" width="16" height="16">，手机上也可以直接用输入法里的表情
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.emoji.not_found
  value: |-
    没看到表情 :sob: 输入一个冒号 <kbd>:</kbd> 会弹出表情选择器，再打出表情名的前几个字，比如 `:bird:`。

    也可以点编辑器里的表情按钮 <img src="%{base_uri}/plugins/discourse-narrative-bot/images/font-awesome-smile.png" width="16" height="16">。
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.emoji.reply
  value: '表情满分 :sparkles:'
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.end.message
  value: |-
    全部通过！@%{username}，这是给你的结业证书，你配得上它：

    %{certificate}

    教程到此结束，接下来可以做这两件事：

    - 想进服玩：到「[白名单与申诉](/c/10-category/10)」版块发帖申请白名单，帖子里有模板。

    - 想先了解社团和论坛：读一遍置顶的「[新人指南](/c/13-category/13)」，里面写了怎么升级、各个信任等级能做什么。

    也可以先去看看[最新话题](%{base_uri}/latest)。想再听我唠叨一遍，随时给我发私信，或者在帖子里 @ 我 `@%{discobot_username}`。
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.flag.instructions
  value: |-
    第八步：举报。论坛的友好氛围要大家一起[维护](%{guidelines_url})。看到广告、辱骂或者别的不合适的内容，可以举报，让作者或者[管理员](%{about_url})知道。举报的原因有很多，选**其他**会拉起一条和版主的私信，可以详细说明。

    > :imp: 我在这写了些难听的话

    点这条帖子的举报按钮 <img src="%{base_uri}/plugins/discourse-narrative-bot/images/font-awesome-flag.png" width="16" height="16">，原因选**不当言论**。
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.flag.not_found
  value: '我的坏帖子还没被举报为「不当言论」 :worried: 用**举报**按钮 <img src="%{base_uri}/plugins/discourse-narrative-bot/images/font-awesome-flag.png" width="16" height="16"> 试试。找不到的话，先点 <img src="%{base_uri}/plugins/discourse-narrative-bot/images/font-awesome-ellipsis.png" width="16" height="16"> 展开更多操作。'
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.flag.reply
  value: "[管理员](%{group_url})会私下收到你的举报通知。如果有足够多的人举报同一个帖子，它会被自动隐藏，以防万一。（我其实没写过难听的话 :angel:，所以举报我已经撤销了。）"
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.formatting.instructions
  value: |-
    第五步：排版。让回复里的几个字变成**粗体**或_斜体_：

    - 输入 `**粗体**` 或 `_斜体_`

    - 或者点编辑器里的 <kbd><b>B</b></kbd>、<kbd><i>I</i></kbd> 按钮
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.formatting.not_found
  value: |-
    你的回复里没有排版 :pencil2:

    再试一次吧。找不到的话，用编辑器里的 <kbd><b>B</b></kbd> 或 <kbd><i>I</i></kbd> 按钮。
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.formatting.reply
  value: '好看！排版还可以用 HTML 和 BBCode，想学更多看这份 [Markdown 教程](https://commonmark.org/help)。以后写红石教程帖会用得上 :nerd:'
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.hello.message
  value: |-
    欢迎加入 %{title}！我是小火把，论坛的引路机器人，专门给新来的同学照路。

    - 我只是个程序，看不懂复杂的话。需要真人帮忙的时候，找[管理员](%{base_uri}/about)，他们都是社团成员。

    - 新账号刚开始有一些限制（比如发帖的频率），这是为了防广告。多逛一逛、多读几个帖子、发几个帖，就会自动升级、解锁更多功能，还会收到[徽章](%{base_uri}/badges)。

    - 请友好地交流，规则写在置顶的「欢迎与社区规则」里。

    接下来我带你把论坛的基本操作走一遍，大约五分钟，每做完一步我会告诉你。走完之后，我会告诉你下一步去哪。
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.hello.title
  value: 欢迎来到 GTMC！我是小火把
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.images.instructions
  value: |-
    第七步：发图。这是一张独角兽的图（别问，我也不知道它怎么跑进矿洞的）：

    <img src="%{base_uri}/plugins/discourse-narrative-bot/images/unicorn.png" width="520" height="520">

    喜欢的话，点这条帖子下面的赞 :heart: 告诉我。

    然后**回复一张图片**：拖进编辑框、点上传按钮、直接粘贴都行，什么图都可以。以后在「建筑展示」晒作品也是这样发。
