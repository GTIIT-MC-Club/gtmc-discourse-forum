- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.likes.reply
  value: 谢谢你的赞！
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.mention.instructions
  value: 第四步：@ 某个人。想让谁看到你的帖子，就输入 `@` 再接他的用户名，他会收到通知。试试在回复里 @ 我：**`@%{discobot_username}`**
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.mention.not_found
  value: '我没在回复里看到我的名字 :frowning: 再 @ 一次 `@%{discobot_username}` 试试。输入 `@` 之后会弹出候选，直接点我就行。'
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.mention.reply
  value: '_谁在叫我？_ :raised_hand: 原来是你！被 @ 的人会收到提醒，所以别滥用哦 :ok_hand:'
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.onebox.instructions
  value: |-
    第二步：发一个链接给我。在回复里把**链接单独放一行**，论坛会自动把它展开成带标题和摘要的卡片。

    从下面挑一个复制（手机上长按链接，电脑上右键选「复制链接地址」）：

     [https://en.wikipedia.org/wiki/Inherently_funny_word](https://en.wikipedia.org/wiki/Inherently_funny_word)
     [https://en.wikipedia.org/wiki/Death_by_coconut](https://en.wikipedia.org/wiki/Death_by_coconut)
     [https://en.wikipedia.org/wiki/Calculator_spelling](https://en.wikipedia.org/wiki/Calculator_spelling)

    如果卡片没有展开（校园网可能访问不到这些网站），不要紧，只要链接单独成行就算过关。
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.onebox.not_found
  value: |-
    没找到链接 :cry: 试试把下面这个链接**单独放一行**，贴在下一条回复里：

    [https://en.wikipedia.org/wiki/Exotic_Shorthair](https://en.wikipedia.org/wiki/Exotic_Shorthair)
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.onebox.reply
  value: 收到！这样展开对大多数 <img src="%{base_uri}/plugins/discourse-narrative-bot/images/font-awesome-link.png" width="16" height="16"> 链接都管用，贴本站其他话题的链接、GitHub 的链接也一样。记住：链接要**独占一行**，前后不能有别的字。
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.quoting.instructions
  value: |-
    第六步：引用。回复的时候引用我的话，我才知道你在回应哪一句。

    > 先插火把，再挖矿。
    >
    > 红石线路出了问题，先查有没有断。
    >
    > 建得糙没关系，发出来就有人夸。

    选中上面 ↑ 你喜欢的那句，点弹出来的**引用**按钮；或者选中文字后点帖子底部的**回复**按钮。

    在引用下面写一两个字，说说为什么选这句，我很好奇 :thinking:
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.quoting.not_found
  value: |-
    你的回复里好像没有引用我的话？

    选中我帖子里的任意文字，就会弹出<kbd>**引用**</kbd>按钮；选中文字后点**回复**也行。再试一次？
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.quoting.reply
  value: '眼光不错，这也是我最喜欢的一句！:left_speech_bubble:'
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.search.hidden_message
  value: |-
    你怎么现在才发现这只水豚？:wink:

    <img src="%{base_uri}/plugins/discourse-narrative-bot/images/capybara-eating.gif">

    发现自己回到话题开头了吗？给这只饿坏的水豚喂点吃的：**回复表情 `%{search_answer}`**，你就会自动回到话题末尾。
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.search.instructions
  value: |-
    _psst_ …… 我在这个话题里藏了个彩蛋。想找到它，**点右上角的搜索图标** <img src="%{base_uri}/plugins/discourse-narrative-bot/images/font-awesome-search.png" width="16" height="16">，选「在此话题中」，然后搜索。

    在这个话题里搜索 "capy​bara"（一种动物）试试。
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.search.not_found
  value: 好像遇到麻烦了，抱歉。你搜索 <img src="%{base_uri}/plugins/discourse-narrative-bot/images/font-awesome-search.png" width="16" height="16"> 的词是 **capy​bara** 吗？
- locale: zh_CN
  key: discourse_narrative_bot.new_user_narrative.search.reply
  value: |-
    找到啦 :tada:

    - 想搜得更细，去[完整搜索页](%{search_url})。

    - 在很长的讨论里想跳到某一楼，用右侧（手机上在底部）的话题时间线。

    - 有实体键盘的话，按 <kbd>?</kbd> 可以看到快捷键。
- locale: zh_CN
  key: discourse_narrative_bot.timeout.message
  value: |-
    @%{username} 好一阵没听到你的动静了，是不是在矿洞里走丢了？

    - 想继续：直接回复我就行。

    - 想跳过这一步：回复 `%{skip_trigger}`。

    - 想从头再来：回复 `%{reset_trigger}`。

    不想继续也没关系，我只是个机器人，火把不会生气的 :sob:
- locale: zh_CN
  key: discourse_narrative_bot.track_selector.do_not_understand.first_response
  value: '谢谢你的回复！不过我是个写得不太聪明的机器人，这句我没看懂 :frowning:'
- locale: zh_CN
  key: discourse_narrative_bot.track_selector.do_not_understand.second_response
  value: |-
    抱歉，我还是没看懂 :anguished:

    我只是个机器人，要找真人请看[关于页面](%{base_path}/about)，管理员都是社团成员。

    我先退到一边，不打扰你了。
- locale: zh_CN
  key: discourse_narrative_bot.track_selector.do_not_understand.track_response
  value: 你可以再试一次；想跳过这一步就回复 `%{skip_trigger}`；想从头再来就回复 `%{reset_trigger}`。
- locale: zh_CN
  key: discourse_narrative_bot.track_selector.random_mention.reply
  value: 想知道我都会些什么？回复 `@%{discobot_username} %{help_trigger}`。
