# 放在 MC 服务器目录的 plugins/GtmcPaper/config.yml。
# 改完后重启服务器生效（M1 不支持热重载）。
# api_key 是密钥，不要把填好的文件提交到仓库或贴到群里。

# 论坛地址。MC 服和论坛在同一台机器时直连本机回环，不绕 VPS。
forum_url: "http://127.0.0.1:8880"

# 论坛的域名（不带 http:// 和路径）。直连回环时 Discourse 靠 Host 头认站点，
# 必须和 app.yml 里的 DISCOURSE_HOSTNAME 一致。
forum_host: "CHANGEME"

# 论坛后台生成的 API Key，用户名选 system，作用域只勾 gtmc:server。
api_key: "CHANGEME"

# 心跳间隔，单位秒，取值 10 到 60。
# 上限 60 是因为论坛 gtmc_heartbeat_timeout_seconds 默认 90 秒没收到心跳就判定离线，
# 间隔再大，丢一次心跳就会闪成离线。
heartbeat_interval_seconds: 30
