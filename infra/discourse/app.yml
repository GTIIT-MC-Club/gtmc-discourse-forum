# 论坛虚拟机（gtmc-forum，192.168.2.111）的 Discourse 容器配置，
# 部署时由 infra/deploy-discourse.sh 装到 /var/discourse/containers/app.yml。
# 对外入口是 Cloudflare Tunnel，见 infra/README.md。

templates:
  - "templates/postgres.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"
  # 不引 templates/web.china.template.yml：它会把容器里的 github.com 改写成代理站，代理连不上时 rebuild 会卡死。

# 只绑内网地址，由同一台虚拟机上的 cloudflared 转发出去，不监听到公网网卡。
expose:
  - "192.168.2.111:8880:80"

params:
  db_default_text_search_config: "pg_catalog.english"
  # 这台 VM 有 8G 内存，给数据库约四分之一。
  db_shared_buffers: "2048MB"
  db_work_mem: "40MB"

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8
  DISCOURSE_DEFAULT_LOCALE: zh_CN
  # 8G 内存配 3 个 worker。扩容到这个 VM 之前不要再加。
  UNICORN_WORKERS: 3

  # 对外的域名。页面里的绝对链接、徽标、OIDC 回调地址都用它，写错了外面打不开、登录不了。
  # 临时换测试域名时用 GTMC_FORUM_HOST 传，别改这里。
  DISCOURSE_HOSTNAME: forum.gtmc.top
  # 不设 DISCOURSE_DEVELOPER_EMAILS：邮件关着，用那个邮箱注册也收不到激活信，成不了管理员。
  # 首个管理员在容器里用 rake admin:create 建，见 infra/README.md。

  # 没有发信配置时整个关掉邮件，否则注册会卡在「等确认信」。
  # 部署时如果本机有 /etc/gtmc/smtp.env，部署脚本会去掉这一行并合并进 SMTP 设置（见 infra/README.md「发信」）。
  DISCOURSE_DISABLE_EMAILS: "yes"

volumes:
  - volume:
      host: /var/discourse/shared/standalone
      guest: /shared
  - volume:
      host: /var/discourse/shared/standalone/log/var-log
      guest: /var/log

# 不装这两个插件，论坛就没有 GTMC 的功能（右栏、服务器状态等）和后台升级页。
hooks:
  after_code:
    - exec:
        cd: $home/plugins
        cmd:
          - git clone https://github.com/discourse/docker_manager.git
          - rm -rf ./discourse-gtmc
          - git clone https://github.com/GTIIT-MC-Club/gtmc-forum-plugin.git discourse-gtmc

run:
  # 经 Cloudflare Tunnel 进来的请求，在容器看来都来自 cloudflared 所在的这台虚拟机
  # （经端口映射后是 docker 网桥地址或本机内网地址），真实 IP 在 CF-Connecting-IP 头里。
  # 不取的话全站共用一个 IP，web.ratelimited 的限流会误伤所有人。
  # 只信任这两类来源：局域网里其他机器直连时来源是它们自己的地址，伪造的头不会被采用。
  # 不用官方的 cloudflare.template.yml：它信任的是 Cloudflare 的公网 IP 段（直接回源的情形），
  # 走 Tunnel 时来源是本机，不在那些段里。写成 outlets/server/ 下的文件的原因见 app.yml。
  - file:
      path: /etc/nginx/conf.d/outlets/server/gtmc-real-ip.conf
      chmod: 644
      contents: |
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.2.111;
        real_ip_header CF-Connecting-IP;
