# 复制到自有机器的 /var/discourse/containers/app.yml，填好 CHANGEME 后 ./launcher rebuild app
# TLS 在境外 VPS 的 Caddy 上终结，这里不启用 ssl / letsencrypt 模板。

templates:
  - "templates/postgres.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"
  # 不引 templates/web.china.template.yml：它的 before_code 会把容器里所有
  # https://github.com/ 改写成 https://mirror.ghproxy.com/...，而这个代理站连不上时
  # git fetch 会无限重试，rebuild 永远停在拉代码。gem/npm 也不缺镜像：
  # 直连 rubygems.org、registry.npmjs.org 都很快。

# 只监听本机回环，由 frpc 转发出去；不直接暴露到局域网
expose:
  - "127.0.0.1:8880:80"

params:
  db_default_text_search_config: "pg_catalog.english"
  # 64G 内存的机器，给数据库 4G 绰绰有余
  db_shared_buffers: "4096MB"
  db_work_mem: "40MB"

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8
  DISCOURSE_DEFAULT_LOCALE: zh_CN
  UNICORN_WORKERS: 4

  DISCOURSE_HOSTNAME: CHANGEME.forum.domain
  # 首个管理员邮箱，用它注册即自动成为管理员
  DISCOURSE_DEVELOPER_EMAILS: "CHANGEME@gtiit.edu.cn"

  # SMTP 和发件地址不写在这里：密码不进仓库。部署脚本从本机 /etc/gtmc/smtp.env 读出来
  # 合并进 env 段，格式见 infra/README.md「发信」。

volumes:
  - volume:
      host: /var/discourse/shared/standalone
      guest: /shared
  - volume:
      host: /var/discourse/shared/standalone/log/var-log
      guest: /var/log

hooks:
  after_code:
    - exec:
        cd: $home/plugins
        cmd:
          - git clone https://github.com/discourse/docker_manager.git
          # 自写插件在单独的仓库 gtmc-forum-plugin，按 Discourse 的标准做法克隆成 plugins/discourse-gtmc：
          # 目录名就是插件名（plugin.rb 的 name），与仓库名无关。完整克隆而不是 --depth 1，
          # 后台「升级」页（docker_manager）要靠 Git 历史算出落后几个提交。
          # 先 rm 是为了在同一个容器里重跑这个钩子时不因目录已存在而失败。
          - rm -rf ./discourse-gtmc
          - git clone https://github.com/GTIIT-MC-Club/gtmc-forum-plugin.git discourse-gtmc

run:
  # 流量路径：用户 → Caddy(VPS) → frp → 127.0.0.1:8880 → 容器。
  # 容器里看到的来源是 docker 网桥，必须从 X-Forwarded-For 取真实 IP，
  # 否则全站用户共用一个 IP，限流会误伤所有人。
  # 写成 outlets/server/ 下的独立文件（官方 cloudflare.template.yml 的做法）：web.template.yml 会删掉
  # discourse.conf 里的 "listen 80;"，对它做 replace 匹配不到，而 pups 匹配不到时不报错。
  - file:
      path: /etc/nginx/conf.d/outlets/server/gtmc-real-ip.conf
      chmod: 644
      contents: |
        set_real_ip_from 172.16.0.0/12;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
