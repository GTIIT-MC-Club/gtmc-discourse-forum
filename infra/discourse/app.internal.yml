# 内网阶段（域名、VPS 都还没有）的 Discourse 容器配置。
# 放在论坛虚拟机 100（gtmc-forum，192.168.2.111）的 /var/discourse/containers/app.yml，
# 生效方式：sudo ./launcher rebuild app。
#
# 这是临时配置，不是最终形态。域名和 VPS 到位后按 infra/discourse/app.yml 换成正式版，
# 然后把本文件删掉——两套配置同时存在会让人不知道该改哪份。

templates:
  - "templates/postgres.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"
  # 不引 templates/web.china.template.yml：它的 before_code 会把容器里所有
  # https://github.com/ 改写成 https://mirror.ghproxy.com/...，而这个代理站从这台机器
  # 连不上（curl 6 秒超时），git fetch 会一直重试，rebuild 就永远停在"正在拉代码"。
  # 它顺带配的 gem/npm 镜像也不需要：实测直连 rubygems.org 0.29s、registry.npmjs.org 0.12s。

# 没有 frpc，内网机器直接连。只绑内网地址，不监听到公网网卡。
expose:
  - "192.168.2.111:8880:80"

params:
  db_default_text_search_config: "pg_catalog.english"
  # 这台 VM 只有 8G 内存，给数据库约四分之一。64G 的宿主机上才用 4096MB。
  db_shared_buffers: "2048MB"
  db_work_mem: "40MB"

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8
  DISCOURSE_DEFAULT_LOCALE: zh_CN
  # 8G 内存配 3 个 worker。扩容到这个 VM 之前不要再加。
  UNICORN_WORKERS: 3

  # 域名没买，先用内网地址当主机名，这样同学用 http://192.168.2.111:8880 就能打开，
  # 不必每人改 hosts。以后换成正式域名只需改这一行再 rebuild。
  DISCOURSE_HOSTNAME: 192.168.2.111
  # 不设 DISCOURSE_DEVELOPER_EMAILS：邮件关着，用那个邮箱注册也收不到激活信，成不了管理员。
  # 首个管理员在容器里用 rake admin:create 建，见 infra/README.md。

  # 还没有 SMTP 服务。开着邮件会让注册卡在"等确认信"，所以先整个关掉。
  # PLAN 第 0 节说注册只允许 @gtiit.edu.cn 邮箱，那要等邮件服务到位后连同 SMTP 配置一起开。
  DISCOURSE_DISABLE_EMAILS: "yes"

volumes:
  - volume:
      host: /var/discourse/shared/standalone
      guest: /shared
  - volume:
      host: /var/discourse/shared/standalone/log/var-log
      guest: /var/log

# 和 app.yml 的同名钩子一致：不装这两个插件，论坛就没有 GTMC 的功能（右栏、服务器状态等）和后台升级页。
hooks:
  after_code:
    - exec:
        cd: $home/plugins
        cmd:
          - git clone https://github.com/discourse/docker_manager.git
          - rm -rf /tmp/gtmc-discourse ./discourse-gtmc
          - git clone --depth 1 https://github.com/GTIIT-MC-Club/gtmc-discourse.git /tmp/gtmc-discourse
          - cp -r /tmp/gtmc-discourse/plugins/discourse-gtmc ./discourse-gtmc
          - rm -rf /tmp/gtmc-discourse
