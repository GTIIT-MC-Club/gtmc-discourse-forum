# 自有机器（校内，无公网 IP）：/etc/frp/frpc.toml
# 生效：`sudo systemctl restart frpc`，日志 `journalctl -u frpc -n 30`。
# 本机只向 VPS 主动连出，不开任何入站端口；对外的 8880 由 VPS 的 frps 提供。

serverAddr = "CHANGEME.vps.ip"
serverPort = 7000

auth.method = "token"
# 必须与 VPS 上 frps.toml 的 auth.token 逐字一致；换 token 时两头一起改、一起重启
auth.token = "CHANGEME-long-random-string"

# 到 frps 的这一跳加密。frps 未配置 certFile 时用的是自签证书，
# 客户端默认不校验对端证书，所以 TLS 只防窃听；真正挡住陌生客户端的是上面的 token。
# 需要防中间人时，在 frps 配 certFile/keyFile，这里补 transport.tls.trustedCaFile 和 serverName。
transport.tls.enable = true

[[proxies]]
name = "discourse"
type = "tcp"
# 自有机器上 Discourse 容器只监听回环，见 infra/discourse/app.yml 的 expose
localIP = "127.0.0.1"
localPort = 8880
# 与 frps.toml 的 allowPorts 对应；frps 把它绑在 VPS 的 127.0.0.1:8880 上，只有本机 Caddy 能访问
remotePort = 8880
